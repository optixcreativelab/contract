<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Optics Creative Lab – Contract Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f7f2f4;--card:#fff;--ink:#14111a;--mute:#7a7382;--line:#eadfe4;--acc:#e0316b;--acc2:#ff6b9a;--soft:#fff0f4;--ok:#16a34a;--sh:0 20px 60px rgba(20,17,26,.10);--hf:"Playfair Display",Georgia,serif;--bf:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b090d;--card:#16111a;--ink:#f6f1f4;--mute:#a69ca9;--line:#2b202e;--soft:#241828;--sh:0 20px 60px rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--bg:#0b090d;--card:#16111a;--ink:#f6f1f4;--mute:#a69ca9;--line:#2b202e;--soft:#241828;--sh:0 20px 60px rgba(0,0,0,.55)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--bf);line-height:1.55;background:var(--bg)}
.hero{background:radial-gradient(700px 360px at 85% -20%,rgba(255,107,154,.35),transparent 60%),radial-gradient(600px 300px at 0% 120%,rgba(224,49,107,.28),transparent 60%),#0d0b10;color:#fff;padding-bottom:84px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:56px;height:56px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.15),0 8px 24px rgba(224,49,107,.4)}
.brand b{display:block;font:700 15px var(--bf);letter-spacing:3px;text-transform:uppercase}
.brand small{display:block;font:500 11px var(--bf);letter-spacing:2px;color:var(--acc2);text-transform:uppercase;margin-top:2px}
.tabs{display:inline-flex;padding:4px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px}
.tab{padding:10px 22px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.7);font:600 13px var(--bf);letter-spacing:.5px;cursor:pointer}
.tab.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.hero h1{margin:34px 0 10px;font:700 clamp(30px,5vw,50px)/1.08 var(--hf);letter-spacing:-.5px;max-width:720px}
.hero h1 em{font-style:italic;color:var(--acc2)}
.hero p{margin:0;color:rgba(255,255,255,.65);max-width:520px;font-size:15px}
main{margin-top:-56px;padding-bottom:50px}
.panel{display:none;grid-template-columns:400px 1fr;gap:24px;align-items:start}.panel.on{display:grid}
@media(max-width:900px){.panel.on{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:var(--sh)}
.card h2{margin:0 0 4px;font:700 22px var(--hf)}
.sub{margin:0 0 4px;color:var(--mute);font-size:13px}
label{display:block;font:700 11px var(--bf);color:var(--mute);margin:20px 0 8px;text-transform:uppercase;letter-spacing:1.4px}
input,select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:500 15px var(--bf);outline:0;transition:.15s}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(224,49,107,.14)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.plans{display:grid;gap:10px}
.plan{display:grid;grid-template-columns:1fr 140px;gap:12px;align-items:center;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;background:var(--bg);transition:.15s}
.plan.on{border-color:var(--acc);background:var(--soft);box-shadow:0 6px 20px rgba(224,49,107,.14)}
.plan .t{font:700 15px var(--bf);display:flex;align-items:center;gap:8px}
.plan .t::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none}
.plan.on .t::before{border:5px solid var(--acc);background:#fff}
.plan small{display:block;color:var(--mute);font-size:12px;margin:2px 0 0 24px}
.plan input{padding:10px 12px;font-weight:700;text-align:right}
.paper{padding:0;overflow:hidden;background:#fff;color:#14111a;border:0;border-radius:6px;box-shadow:0 30px 80px rgba(20,17,26,.22)}
.ph{background:#0d0b10;color:#fff;padding:26px 36px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:5px solid var(--acc)}
.ph .b{display:flex;align-items:center;gap:16px}
.ph img{width:66px;height:66px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.18)}
.ph .n{font:700 17px var(--bf);letter-spacing:3.5px;text-transform:uppercase}
.ph .n small{display:block;font:500 10.5px var(--bf);letter-spacing:2.5px;color:var(--acc2);margin-top:4px}
.ph .r{text-align:right}.ph .r b{display:block;font:700 22px var(--hf);letter-spacing:1px}.ph .r span{font-size:11px;color:#b9aebd;letter-spacing:1px}
.pb{padding:34px 36px 26px}
.meta{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;margin-bottom:26px}
.meta small{display:block;font:700 10.5px var(--bf);letter-spacing:2px;color:#8a8190;text-transform:uppercase;margin-bottom:6px}
.meta .c{font:700 28px/1.15 var(--hf);word-break:break-word}
.meta .s{font:600 15px var(--bf)}
.badge{display:inline-block;margin-top:6px;font:700 11px var(--bf);letter-spacing:1px;padding:6px 12px;border-radius:99px;background:#f3eef0;color:#7a7382;text-transform:uppercase}
.badge.ok{background:#16a34a;color:#fff}
table{width:100%;border-collapse:collapse;margin-bottom:6px}
th{text-align:left;font:700 10.5px var(--bf);letter-spacing:2px;text-transform:uppercase;color:#8a8190;padding:10px 0;border-bottom:2px solid #14111a}
th:last-child,td:last-child{text-align:right}
td{padding:16px 0;border-bottom:1px solid #eee6ea;font-size:14px;vertical-align:top}
td b{font-weight:700}td small{display:block;color:#8a8190;font-size:12px;margin-top:2px}
.sum{margin-left:auto;width:min(340px,100%);margin-top:14px}
.sum div{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;color:#5b5461}
.sum .tt{border-top:2px solid #14111a;margin-top:6px;padding-top:12px;font:700 20px var(--hf);color:#14111a}
.adv{margin-top:22px;border-radius:14px;padding:20px 24px;color:#fff;background:linear-gradient(135deg,#0d0b10,#2a1230 55%,var(--acc));display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.adv small{display:block;font:600 11px var(--bf);letter-spacing:2px;text-transform:uppercase;opacity:.85}
.adv .big{font:700 34px/1.1 var(--hf)}.adv .l{font-size:13px;opacity:.85;max-width:210px;text-align:right}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:28px}
.sa{height:68px;display:flex;align-items:flex-end}.si{max-height:64px;max-width:100%;object-fit:contain}
.sl{border-top:1.5px solid #14111a;padding-top:8px;font-size:11.5px;color:#7a7382;letter-spacing:.5px}
.pf{background:#faf5f7;text-align:center;font-size:11px;letter-spacing:2.5px;color:#8a8190;padding:14px;text-transform:uppercase}
.btns{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.btn{flex:1;min-width:180px;padding:15px;border:0;border-radius:14px;font:700 14px var(--bf);letter-spacing:.5px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 10px 24px rgba(224,49,107,.3)}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ok{background:var(--ok);box-shadow:none}
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.chip{padding:12px 6px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:600 12.5px var(--bf);cursor:pointer;text-align:center;line-height:1.3}.chip.on{border-color:var(--acc);background:var(--soft);color:var(--acc)}
input[type=file]{padding:10px;font-size:13px}.hint{font-size:12px;color:var(--mute);margin-top:6px}
.cl{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.pp{width:86px;height:106px;object-fit:cover;border-radius:6px;border:1.5px solid #14111a;flex:none}
.sh{font:700 17px var(--hf);margin:28px 0 12px;border-bottom:2px solid var(--acc);padding-bottom:7px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;padding:16px 18px;background:#faf5f7;border-radius:12px;border-left:4px solid var(--acc)}
.pg small{display:block;font:700 10px var(--bf);letter-spacing:1.8px;text-transform:uppercase;color:#8a8190}.pg b{font:700 14px var(--bf);word-break:break-all}
.note{font-size:11.5px;color:#b3195a;font-weight:600;margin-top:8px}
.terms{break-inside:avoid}.terms ol{margin:0;padding-left:20px;font-size:11.8px;line-height:1.62;color:#4a4350}.terms li{margin-bottom:7px}.terms li::marker{color:var(--acc);font-weight:700}
@media(max-width:560px){.pg{grid-template-columns:1fr}}
.right{min-width:0}
footer{text-align:center;color:var(--mute);font-size:12px;letter-spacing:1px;padding:0 0 40px}
@media(max-width:560px){.pb,.ph{padding:22px}.meta{grid-template-columns:1fr}.plan{grid-template-columns:1fr 112px}.ph .r{text-align:left}.adv .l{text-align:left}}
@page{size:A4;margin:0}
@media print{html,body{background:#fff!important}.hero,.controls,.btns,footer{display:none!important}main{margin:0;padding:0}.panel{display:none!important}.panel.on{display:block!important}.paper{box-shadow:none;border-radius:0}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.wrap{padding:0;max-width:none}}
</style>
</head>

function build(id){
const c=CFG[id],root=document.getElementById('p-'+id),now=new Date();
const S={plan:'m',prices:Object.fromEntries(c.plans.map(p=>[p.k,p.p])),sym:c.sym,client:'',pct:20,ok:false,okAt:'',svc:'b'};const SV={g:'Graphic Designing',v:'Video Editing',b:'Graphic Designing &amp; Video Editing'};const AC={hn:'Optics Creative Lab',bk:'',an:'',ic:'',up:''};
const no='OCL-'+now.getFullYear()+pad(now.getMonth()+1)+'-'+c.code;
const q=s=>root.querySelector(s),Q=k=>q('#'+id+'-'+k);
root.innerHTML=`
<div class="card controls"><h2>Contract details</h2><p class="sub">Everything updates live on the contract.</p>
<label>Client name</label><input id="${id}-cl" placeholder="e.g. Acme Pvt Ltd">
<label>Service</label><div class="svc"><button type="button" class="chip" data-s="g">Graphic Designing</button><button type="button" class="chip" data-s="v">Video Editing</button><button type="button" class="chip" data-s="b">Both</button></div>
<label>Plan &amp; price</label>
<div class="plans">${c.plans.map(p=>`<div class="plan" data-k="${p.k}"><div><div class="t">${p.l}</div><small>${p.s}</small></div><input type="number" min="0" step="any" data-k="${p.k}" value="${p.p}"></div>`).join('')}</div>
<div class="row"><div><label>Currency symbol</label><select id="${id}-sy"><option>$</option><option>₹</option><option>€</option><option>£</option><option>AED</option><option value="_c">Custom…</option></select></div>
<div><label>Advance (%)</label><input id="${id}-ad" type="number" min="0" max="100" step="any"></div></div>
<input id="${id}-cs" placeholder="Type custom symbol" style="display:none;margin-top:10px">
<label>Client signature (photo)</label><input type="file" accept="image/*" id="${id}-sf"><div class="hint">Appears above the client signature line.</div>
<label>Passport-size photo</label><input type="file" accept="image/*" id="${id}-pf"><div class="hint">Appears beside the client name on the contract.</div>
<label>Payment account (shown on contract)</label><input id="${id}-ihn" placeholder="Account holder name"><input id="${id}-ibk" placeholder="Bank name" style="margin-top:8px"><input id="${id}-ian" placeholder="Account number" style="margin-top:8px"><input id="${id}-iic" placeholder="IFSC / SWIFT code" style="margin-top:8px"><input id="${id}-iup" placeholder="UPI ID (optional)" style="margin-top:8px"><div class="hint">Enter only your genuine business account, in the name of Optics Creative Lab.</div>
</div>
<div class="right"><div class="card paper"><div class="ph"><div class="b"><img src="${LOGO}" alt=""><div class="n">Optics Creative Lab<small>GRAPHIC DESIGNER · VIDEO EDITOR</small></div></div><div class="r"><b>SERVICE CONTRACT</b><span>REF · ${no}</span><span style="display:block;margin-top:4px;color:#ff8fb4">optixcreativelab@gmail.com</span></div></div>
<div class="pb"><div class="meta"><div class="cl"><div><small>Prepared for</small><div class="c" id="${id}-v1"></div></div><img id="${id}-pp" class="pp" alt="" style="display:none"></div><div><small>Date</small><div class="s">${fd(now)}</div><span class="badge" id="${id}-bd">Draft</span></div></div>
<table><thead><tr><th>Description</th><th>Term</th><th>Amount</th></tr></thead><tbody><tr><td id="${id}-v0"></td><td id="${id}-v2"></td><td id="${id}-v5"></td></tr></tbody></table>
<div class="sum"><div><span id="${id}-al"></span><span id="${id}-av2"></span></div><div><span>Balance after advance</span><span id="${id}-ab"></span></div><div class="tt"><span>Contract total</span><span id="${id}-v6"></span></div></div>
<div class="adv"><div><small id="${id}-al2"></small><div class="big" id="${id}-av"></div></div><div class="l">Payable in advance to confirm this contract</div></div>
<div class="sh">Payment details</div><div class="pg"><div><small>Account name</small><b id="${id}-phn"></b></div><div><small>Bank</small><b id="${id}-pbk"></b></div><div><small>Account number</small><b id="${id}-pan"></b></div><div><small>IFSC / SWIFT</small><b id="${id}-pic"></b></div><div><small>UPI ID</small><b id="${id}-pup"></b></div><div><small>Email</small><b>optixcreativelab@gmail.com</b></div></div><div class="note">Pay only to the official account above. Do not pay to any other person, number or account.</div>
<div class="terms"><div class="sh">Payment Terms &amp; Conditions</div><ol>
<li><b>Advance.</b> <span id="${id}-tp"></span>% of the contract value is payable in advance to confirm this contract. Work starts only after the advance is received.</li>
<li><b>Balance.</b> The remaining amount is payable as mutually agreed in writing between the Client and Optics Creative Lab. Delivery of final files may be held until all dues are cleared.</li>
<li><b>Official account only.</b> All payments must be made only to the bank account / UPI ID shown above, in the name of Optics Creative Lab. The company is not responsible for any payment made to any other account, person or number.</li>
<li><b>Proof of payment.</b> After paying, the Client must send the transaction ID or receipt to optixcreativelab@gmail.com. A payment is treated as received only after it is credited to the official account.</li>
<li><b>Genuine payments.</b> Payments must come from lawful sources. Fake payment screenshots, forged documents, bad-faith chargebacks, stopped or bounced cheques and any other fraudulent payment practice are strictly prohibited.</li>
<li><b>Legal action.</b> In case of fraud, forgery or non-payment, Optics Creative Lab may take legal action, including filing a police complaint and civil or criminal proceedings under the applicable laws of India (such as the Indian Contract Act, 1872, the Information Technology Act, 2000, the Negotiable Instruments Act, 1881 and the Bharatiya Nyaya Sanhita, 2023), and may recover costs and damages.</li>
<li><b>Late payment.</b> Work and delivery may be paused until overdue payments are cleared.</li>
<li><b>Taxes.</b> Applicable taxes and government charges, if any, are payable as per government rules.</li>
<li><b>Governing law.</b> This contract is governed by the laws of India, and disputes are subject to the jurisdiction of the courts where Optics Creative Lab is located.</li>
<li><b>Acceptance.</b> By confirming or signing this contract, the Client agrees to these terms.</li></ol></div>
<div class="sig"><div><div class="sa"></div><div class="sl">Authorised signatory · Optics Creative Lab</div></div><div><div class="sa"><img id="${id}-si" class="si" alt="" style="display:none"></div><div class="sl" id="${id}-sg"></div></div></div></div>
<div class="pf">Optics Creative Lab · optixcreativelab@gmail.com</div></div>
<div class="btns"><button class="btn" id="${id}-cf">Confirm Contract</button><button class="btn alt" onclick="window.print()">Print / Save PDF</button></div></div>`;
const cur=()=>c.plans.find(p=>p.k===S.plan);
const fmt=n=>(S.sym?S.sym+' ':'')+Number(n||0).toLocaleString(c.loc,{maximumFractionDigits:2});
function upd(){
const p=cur(),price=+S.prices[p.k]||0,adv=price*(+S.pct||0)/100,pc=(+S.pct||0);
Q('v1').textContent=S.client||'Client name';
Q('v2').innerHTML='<b>'+p.l+'</b><small>'+p.s+'</small>';
Q('v0').innerHTML='<b>'+SV[S.svc]+'</b><small>Creative services</small>';
for(const k in AC)Q('p'+k).textContent=AC[k]||'—';Q('tp').textContent=pc;
root.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.s===S.svc));
Q('v5').textContent=fmt(price);Q('v6').textContent=fmt(price);
Q('al').textContent='Advance ('+pc+'%)';Q('av2').textContent=fmt(adv);
Q('al2').textContent='Advance payment · '+pc+'%';
Q('av').textContent=fmt(adv);Q('ab').textContent=fmt(price-adv);
Q('sg').textContent='Client'+(S.client?' · '+S.client:'');
const bd=Q('bd'),cf=Q('cf');
bd.className='badge'+(S.ok?' ok':'');bd.textContent=S.ok?'✓ Confirmed · '+S.okAt:'Draft';
cf.textContent=S.ok?'Contract Confirmed ✓ (tap to undo)':'Confirm Contract';cf.className='btn'+(S.ok?' ok':'');
root.querySelectorAll('.plan').forEach(b=>b.classList.toggle('on',b.dataset.k===S.plan));
}
Q('cl').oninput=e=>{S.client=e.target.value.trim();upd()};
root.querySelectorAll('.plan').forEach(b=>{
b.onclick=()=>{S.plan=b.dataset.k;upd()};
const i=b.querySelector('input');
i.onfocus=()=>{S.plan=b.dataset.k;upd()};
i.oninput=e=>{S.prices[b.dataset.k]=e.target.value;S.plan=b.dataset.k;upd()};
});
const sy=Q('sy'),cs=Q('cs');sy.value=c.sym;
sy.onchange=()=>{if(sy.value==='_c'){cs.style.display='block';cs.focus();S.sym=cs.value}else{cs.style.display='none';S.sym=sy.value}upd()};
cs.oninput=()=>{S.sym=cs.value;upd()};
Q('ad').value=S.pct;Q('ad').oninput=e=>{S.pct=e.target.value;upd()};
const rd=(f,img)=>{const file=f.files[0];if(!file){img.style.display='none';img.removeAttribute('src');return}const r=new FileReader();r.onload=()=>{img.src=r.result;img.style.display='block'};r.readAsDataURL(file)};
Q('sf').onchange=e=>rd(e.target,Q('si'));Q('pf').onchange=e=>rd(e.target,Q('pp'));
root.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{S.svc=b.dataset.s;upd()});
for(const k in AC){const el=Q('i'+k);el.value=AC[k];el.oninput=e=>{AC[k]=e.target.value.trim();upd()}}
Q('cf').onclick=()=>{S.ok=!S.ok;S.okAt=S.ok?fd(new Date()):'';upd()};
upd();
}
build('usd');build('inr');
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
['usd','inr'].forEach(i=>document.getElementById('p-'+i).classList.toggle('on',i===t.dataset.t));
});
</script>
</body>
</html>
